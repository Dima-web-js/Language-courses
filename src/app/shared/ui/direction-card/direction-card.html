<article class="card">
  <mat-icon aria-hidden="true">
    @if (icon() === 'hobbies_outline') {
      <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">
        <path d="M8 7h8a4 4 0 0 1 3.9 3.1l1.3 6a2.6 2.6 0 0 1-4.4 2.4L14.5 16h-5l-2.3 2.5a2.6 2.6 0 0 1-4.4-2.4l1.3-6A4 4 0 0 1 8 7Z" />
        <path d="M7.5 10v4m-2-2h4M10 7V5a2 2 0 0 1 2-2h2" />
        <circle cx="16" cy="10.5" r=".75" fill="currentColor" stroke="none" />
        <circle cx="18" cy="13" r=".75" fill="currentColor" stroke="none" />
      </svg>
    } @else {
      {{ icon() }}
    }
  </mat-icon>
  <span class="heading">{{ heading() }}</span>
    <span class="description">{{ description() }}</span>
    <span class="example">{{ example() }}</span>
</article>
